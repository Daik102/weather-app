<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="icon" href="./images/weather-cloudy-custom.png" type="image/x-icon" />
  </head>
  <body>
    <div class="wrapper">
      <main class="main">
        <h1 class="app-title">Odin Weather App</h1>
        <form class="search-section">
          <input type="text" name="location-input" id="location-input" placeholder="Enter the location">
          <button class="search-btn" type="button">Search</button>
        </form>
        <h2 class="location-board"></h2>
        <div class="container"></div>
        <div class="switch-section">
          <button class="switch-btn hourly-btn">Hourly</button>
          <button class="switch-btn two-days-btn">Today/Tomorrow</button>
          <button class="switch-btn fifteen-days-btn">15 days</button>
        </div>
      </main>
      <footer class="footer">
        <a
          class="link"
          href="https://www.visualcrossing.com/"
          target="_blank"
          >Weather data is from Visual Crossing.</a
        >
        <a
          class="link"
          href="https://daik102.github.io/homepage/"
          target="_blank"
          >2025 Daik</a
        >
      </footer>
    </div>
  </body>
</html>
